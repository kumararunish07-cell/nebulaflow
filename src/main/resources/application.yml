spring:
  application:
    name: nebulaflow
  datasource:
    url: jdbc:postgresql://localhost:5432/nebulaflow
    username: nebulaflow
    password: nebulaflow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
nebulaflow:
  events:
    topic: nebulaflow.lifecycle
