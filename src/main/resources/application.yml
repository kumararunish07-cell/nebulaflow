spring:
  application:
    name: nebulaflow
  datasource:
    url: jdbc:postgresql://localhost:5432/nebulaflow
    username: nebulaflow
    password: nebulaflow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
nebulaflow:
  events:
    topic: nebulaflow.lifecycle
  cache:
    ttl: 10m
  outbox:
    poll-delay: 1000
  security:
    # Development-only identities. Set NEBULAFLOW_API_KEYS in real environments.
    # Format: apiKey=principal|ROLE_NAME|TENANTS:tenant-a,tenant-b;otherKey=...
    api-keys: "${NEBULAFLOW_API_KEYS:demo-admin=admin|ROLE_ADMIN|ROLE_OPERATOR|TENANTS:demo;demo-operator=operator|ROLE_OPERATOR|TENANTS:demo;demo-viewer=viewer|ROLE_VIEWER|TENANTS:demo}"
  runners:
    http:
      allowed-hosts: "${NEBULAFLOW_HTTP_ALLOWED_HOSTS:localhost,127.0.0.1}"
      default-timeout: "${NEBULAFLOW_HTTP_TIMEOUT:10s}"
      max-response-bytes: "${NEBULAFLOW_HTTP_MAX_RESPONSE_BYTES:1048576}"
  rag:
    # Local deterministic embeddings keep the sample self-contained. Replace EmbeddingModel for hosted embeddings.
    embedding-dimensions: "${NEBULAFLOW_RAG_EMBEDDING_DIMENSIONS:256}"
    chunk-size: "${NEBULAFLOW_RAG_CHUNK_SIZE:1200}"
    chunk-overlap: "${NEBULAFLOW_RAG_CHUNK_OVERLAP:150}"
    max-top-k: "${NEBULAFLOW_RAG_MAX_TOP_K:20}"
