# Copy to config/application-secrets.yml locally or mount equivalent values at /run/secrets/nebulaflow.yml.
# Never commit real credentials. Environment variables may be used instead.
spring:
  datasource:
    url: jdbc:postgresql://db.internal:5432/nebulaflow
    username: replace-me
    password: replace-me
nebulaflow:
  security:
    mode: OIDC
    api-keys: ""
    oidc:
      issuer-uri: https://idp.example.com/realms/nebulaflow
      audience: nebulaflow-api
      roles-claim: roles
      tenant-claim: tenants
      principal-claim: sub
